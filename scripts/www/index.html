<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日签到页面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "PingFang SC", "Microsoft Yahei", sans-serif;
    }
    body {
      background-color: #fff;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }

    /* 输入框区域 - 核心修改部分 */
    .input-group {
      margin-bottom: 20px;
      /* 让输入框容器居中，且宽度自适应内容 */
      display: flex;
      justify-content: center;
      position: relative;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
    .input-group input {
      /* 取消固定宽度，自适应内容 */
      width: auto;
      min-width: fit-content;
      padding: 12px 40px 12px 12px;
      /* 初始状态隐藏边框 */
      border: none;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
      /* 文字居中显示 */
      text-align: center;
      /* 只读状态下背景色优化 */
      background-color: #f8f9fa;
    }
    /* 编辑状态（非只读）显示边框 */
    .input-group input:not([readonly]) {
      border: 1px solid #eee;
    }
    /* 编辑状态聚焦时的边框样式 */
    .input-group input:focus {
      border-color: #5cdb95;
    }
    .edit-btn {
      /* 调整编辑按钮定位，相对于输入框 */
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #ccc;
      cursor: pointer;
      font-size: 18px;
      /* 确保按钮在输入框上层 */
      z-index: 1;
    }

    /* 签到按钮 */
    .sign-btn-container {
      display: flex;
      justify-content: center;
      margin: 40px 0;
    }
    .sign-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background-color: #5cdb95;
      color: #fff;
      border: none;
      font-size: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(92, 219, 149, 0.3);
      transition: transform 0.2s;
    }
    .sign-btn:hover {
      transform: scale(1.05);
    }
    /* 新增：签到完成后的按钮样式 */
    .sign-btn.signed {
      background-color: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }
    .sign-btn.signed:hover {
      transform: scale(1); /* 取消hover放大效果 */
    }
    .ghost-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    /* 提示区域 */
    .tip {
      background-color: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .agreement {
      text-align: center;
      color: #999;
      font-size: 12px;
    }
    .agreement a {
      color: #5cdb95;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 输入框：你的姓名 -->
    <div class="input-group">
      <input type="text" id="nameInput" placeholder="你的姓名" readonly>
      <span class="edit-btn" id="nameEditBtn">✎</span>
    </div>

    <!-- 输入框：紧急联系人邮箱 -->
    <div class="input-group">
      <input type="email" id="emailInput" placeholder="紧急联系人邮箱" readonly>
      <span class="edit-btn" id="emailEditBtn">✎</span>
    </div>

    <!-- 签到按钮 -->
    <div class="sign-btn-container">
      <button class="sign-btn" id="signBtn">
        <span class="ghost-icon">👻</span>
        <span class="sign-text">今日签到</span>
      </button>
    </div>

    <!-- 提示 -->
    <div class="tip">
      ⚠️ 多日未签到,系统将以你的名义,在次日邮件通知你的紧急联系人
    </div>

    <!-- 协议提示 -->
    <div class="agreement">
      签到即同意 <a href="#">用户协议</a> 和 <a href="#">隐私政策</a>
    </div>
  </div>

  <script>
    // 编辑按钮逻辑：姓名
    const nameInput = document.getElementById('nameInput');
    const nameEditBtn = document.getElementById('nameEditBtn');
    nameEditBtn.onclick = () => {
      nameInput.removeAttribute('readonly');
      nameInput.focus();
    };
    nameInput.onblur = () => {
      nameInput.setAttribute('readonly', true);
      // 这里可以添加“保存到本地/后端”的逻辑
    };

    // 编辑按钮逻辑：紧急联系人邮箱
    const emailInput = document.getElementById('emailInput');
    const emailEditBtn = document.getElementById('emailEditBtn');
    emailEditBtn.onclick = () => {
      emailInput.removeAttribute('readonly');
      emailInput.focus();
    };
    emailInput.onblur = () => {
      emailInput.setAttribute('readonly', true);
      // 这里可以添加“保存到本地/后端”的逻辑
    };

    // 签到按钮逻辑
    const signBtn = document.getElementById('signBtn');
    const signText = document.querySelector('.sign-text');
    let isSigned = false; // 标记是否已签到

    signBtn.onclick = () => {
      if (!isSigned) { // 只有未签到时才能点击
        // 1. 修改按钮样式为灰色
        signBtn.classList.add('signed');
        // 2. 修改按钮文字
        signText.textContent = '签到完成';
        // 3. 标记为已签到
        isSigned = true;
        // 4. 提示签到成功
        alert('签到成功！');
        
        // 这里可以添加“签到请求后端接口”的逻辑
      }
    };
  </script>
</body>
</html>
